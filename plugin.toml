id = "quonn77.spock-assistant"
name = "Spock Assistant"
version = "0.1.0"
description = "Unofficial Spock Framework support for OpenIDEA, not affiliated with the Spock Framework project. Runs a Maven project's Spock specs and shows the results per feature in the test tree and checks the order of Spock blocks."
authors = ["The spock-assistant contributors"]
# Marketplace categories (up to 3): languages, themes, icon-themes, linters,
# vcs, ai, frameworks, tools, other.
categories = ["tools"]
engines.openidea = "^1.4"
# Built by `openidea-plugin build`. The code is loaded the first time one of
# its commands runs; the commands below show in Find Action before that.
wasm = "dist/plugin.wasm"

license = "Apache-2.0"

# What the code may do. The user approves these when installing.
[capabilities]
# process:mvn   -> runs `mvn test` (the run configuration the IDE starts and pins by path and hash).
# project.read  -> reads pom.xml and target/surefire-reports/TEST-*.xml to build the test tree.
required = ["process:mvn", "project.read"]

[[contributes.runConfigurations]]
files = ["pom.xml"]

[[contributes.commands]]
id = "run-tests"
title = "Spock Assistant: Run Spock Specs (Maven)"
category = "Spock Assistant"

[[contributes.commands]]
id = "run-spec"
title = "Spock Assistant: Run Spec (from the gutter)"
category = "Spock Assistant"

[[contributes.providers]]
kinds = ["gutter-actions", "diagnostics"]
languages = ["groovy"]
